# 256-colour + true-colour passthrough
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Mouse support
set -g mouse on

# No delay on escape
set -sg escape-time 0

# Extended keys — required for modified Enter and other key combos (e.g. in pi)
set -g extended-keys on
set -g extended-keys-format csi-u

# Bigger scrollback
set -g history-limit 10000

# Start window/pane numbering at 1; renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi keys in copy mode
setw -g mode-keys vi

# ── pi.dev colour palette ─────────────────────────────────────────────────────
# bg_deep=#0d1116  bg=#161d27  panel=#212730
# text=#EBE7E4  muted=#9fa4ab  accent=#6A9FCC
# border=#495059  rust=#8f3222

# ── Status bar — two lines ────────────────────────────────────────────────────
set -g status 2
set -g status-style 'bg=#161d27 fg=#9fa4ab'

# Line 1: session name + windows + clock
set -g status-format[0] '#[bg=#161d27 fg=#6A9FCC bold] #S  #[default bg=#161d27]#{W:#[fg=#9fa4ab] #I #W #[default],#[fg=#EBE7E4 bold] #I #W #[default]}#[align=right]#[fg=#9fa4ab] %H:%M '

# Line 2: shortcuts
set -g status-format[1] '#[bg=#0d1116 fg=#495059]  Ctrl+b 1#[fg=#9fa4ab]·pi   #[fg=#495059]Ctrl+b 2#[fg=#9fa4ab]·shell   #[fg=#495059]Ctrl+b c#[fg=#9fa4ab]·new window   #[fg=#495059]Ctrl+b d#[fg=#9fa4ab]·detach   #[fg=#495059]Ctrl+b [#[fg=#9fa4ab]·scroll   #[fg=#495059]Ctrl+b x#[fg=#9fa4ab]·close pane '

# Pane background — panel colour so pi-tui block backgrounds blend in
set -g window-style        'bg=#212730 fg=#EBE7E4'
set -g window-active-style 'bg=#212730 fg=#EBE7E4'

# Pane borders
set -g pane-border-style        'fg=#495059'
set -g pane-active-border-style 'fg=#6A9FCC'
